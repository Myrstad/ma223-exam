[package]
name = "ma223-exam"
version = "0.1.0"
edition = "2024"

[dependencies]
burn = { version = "0.16", features = ["train", "wgpu", "vision", "tui", "fusion"] }
ndarray = "0.15"
image = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

reqwest = { version = "0.13.2", features = ["blocking"] }
zip-extract = "0.1"
walkdir = "2.5.0"
csv = "1.3"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.10"